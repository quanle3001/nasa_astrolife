name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "software/**"
      - ".github/workflows/desktop-installers.yml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            command: package:mac
            artifact: AstroLife-macOS-arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
            command: package:mac
            artifact: AstroLife-macOS-x64
          - name: Windows x64
            os: windows-latest
            arch: x64
            command: package:win
            artifact: AstroLife-Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          python -m pip --python .venv install -r software/requirements.txt -r software/requirements-dev.txt
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Test desktop and platform launch paths
        working-directory: desktop
        run: |
          npm test
          npm run test:packaging
      - name: Build installer and prove bundled backend
        working-directory: desktop
        run: npm run ${{ matrix.command }}
      - name: Launch packaged app and verify renderer IPC
        working-directory: desktop
        run: npm run package:verify
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*-Setup.exe
          if-no-files-found: error
          retention-days: 30
