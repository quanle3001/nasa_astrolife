<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AstroLife">
  <!-- AstroLife mark: original artwork. A deep-space disc with stars and a tilted orbit
       (after the classic space-agency emblem), a rising arch "A" for lift (after the
       Antigravity mark) and a heartbeat crossbar for crew health. No NASA insignia. -->
  <defs>
    <radialGradient id="al-disc" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset=".55" stop-color="#123b8f"/>
      <stop offset="1" stop-color="#071634"/>
    </radialGradient>
    <linearGradient id="al-arch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9fe9f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="al-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#46d9e8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#al-disc)"/>
  <circle cx="32" cy="32" r="29.4" fill="none" stroke="#9fe9f2" stroke-opacity=".35" stroke-width="1.2"/>
  <g fill="#fff">
    <circle cx="15" cy="20" r="1.1"/>
    <circle cx="47.5" cy="15.5" r=".9"/>
    <circle cx="50" cy="44" r=".8" fill-opacity=".8"/>
    <circle cx="20.5" cy="47" r=".7" fill-opacity=".7"/>
    <circle cx="25" cy="13" r=".6" fill-opacity=".8"/>
  </g>
  <!-- back half of the orbit, behind the arch -->
  <path d="M5.5 37.5 C 9 27, 40 17.5, 56 22.5" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.8" stroke-linecap="round"/>
  <!-- rising arch "A" -->
  <path d="M18.5 50 C 22 32, 26.5 15.5, 32 15.5 C 37.5 15.5, 42 32, 45.5 50" fill="none" stroke="url(#al-arch)" stroke-width="5" stroke-linecap="round"/>
  <!-- heartbeat crossbar -->
  <path d="M20.5 39 H27 L29.2 34.2 L32.2 43.5 L34.6 37.2 L36.4 39 H43.5" fill="none" stroke="#46d9e8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front half of the orbit, over the arch -->
  <path d="M56 22.5 C 62 24.5, 58 33, 46 38.5 C 33 44.5, 12 47, 5.5 37.5" fill="none" stroke="url(#al-orbit)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="56" cy="22.5" r="2.4" fill="#46d9e8"/>
  <circle cx="56" cy="22.5" r="4.2" fill="#46d9e8" fill-opacity=".22"/>
</svg>
